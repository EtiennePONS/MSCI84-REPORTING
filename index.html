<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>M.S.C.I 84 — Rapports d'intervention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="apple-touch-icon" href="/public/icons/apple-touch-icon-iphone-60x60.png">
<link rel="apple-touch-icon" sizes="60x60" href="/public/icons/apple-touch-icon-ipad-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="/public/icons/apple-touch-icon-iphone-retina-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="/public/icons/apple-touch-icon-ipad-retina-152x152.png">
<link rel="icon" type="image/png" sizes="32x32" href="/public/icons/icon-512.png" />
<style>
  :root{
    --navy:#132140;
    --navy-deep:#0a1226;
    --navy-mid:#1c3055;
    --silver:#c7cedb;
    --silver-dim:#9aa4b5;
    --accent:#e35a2a;
    --accent-blue:#2f6fb0;
    --bg:#eef0f3;
    --panel:#ffffff;
    --border:#dfe3e9;
    --text:#1a2233;
    --muted:#6b7686;
    --ok:#2c9a5e;
    --warn:#dd9a1f;
    --danger:#c94b3f;
    --radius:10px;
    --shadow:0 1px 2px rgba(19,33,64,.06), 0 8px 24px -12px rgba(19,33,64,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
  body{
    background-image:
      linear-gradient(var(--bg),var(--bg)),
      repeating-linear-gradient(45deg, rgba(19,33,64,.025) 0px, rgba(19,33,64,.025) 1px, transparent 1px, transparent 14px);
  }
  h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:var(--navy);}
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:'Inter',sans-serif;}

  /* ---------- App bar ---------- */
  .appbar{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
    border-bottom:3px solid var(--accent);
  }
  .appbar img{width:42px;height:auto;flex:none; object-fit:contain;}
  .appbar .titles{flex:1; min-width:0;}
  .appbar .titles .brand{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:20px; letter-spacing:.03em; line-height:1;}
  .appbar .titles .brand span{color:var(--accent);}
  .appbar .titles .sub{font-size:10.5px; color:var(--silver); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}

  .tabs{display:flex; background:var(--navy-mid); border-bottom:1px solid rgba(255,255,255,.08);}
  .tabs button{
    flex:1; background:transparent; border:none; color:var(--silver); padding:11px 6px;
    font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:14.5px; letter-spacing:.06em; text-transform:uppercase;
    border-bottom:3px solid transparent; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .tabs button.active{color:#fff; border-bottom-color:var(--accent); background:rgba(255,255,255,.04);}
  .tabs svg{width:15px;height:15px;}

  main{max-width:760px; margin:0 auto; padding:16px 14px 90px;}

  /* ---------- Cards / panels ---------- */
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); position:relative;}
  .rivet{position:absolute; width:7px; height:7px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, var(--silver-dim) 60%, #7c8496); box-shadow:inset 0 0 1px rgba(0,0,0,.4);}
  .rivet.tl{top:8px;left:8px;} .rivet.tr{top:8px;right:8px;} .rivet.bl{bottom:8px;left:8px;} .rivet.br{bottom:8px;right:8px;}

  .stepper{display:flex; gap:4px; margin-bottom:16px;}
  .stepper .st{flex:1; text-align:center; padding:8px 2px; border-radius:8px; background:var(--panel); border:1px solid var(--border); position:relative;}
  .stepper .st .n{display:block; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);}
  .stepper .st .l{display:block; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-top:1px;}
  .stepper .st.active{background:var(--navy); border-color:var(--navy);}
  .stepper .st.active .n,.stepper .st.active .l{color:#fff;}
  .stepper .st.done{background:#eef7f0; border-color:#bfe3cb;}
  .stepper .st.done .n,.stepper .st.done .l{color:var(--ok);}

  .card{padding:20px 18px;}
  .card + .card{margin-top:14px;}
  .section-title{font-size:19px; margin:0 0 3px; display:flex; align-items:center; gap:8px;}
  .section-title .tag{font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--navy); color:#fff; padding:2px 6px; border-radius:4px; letter-spacing:.03em;}
  .section-hint{font-size:12.5px; color:var(--muted); margin:0 0 16px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--navy); text-transform:uppercase; letter-spacing:.03em; margin-bottom:5px;}
  .field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field textarea,.field select{
    width:100%; padding:10px 11px; border:1.5px solid var(--border); border-radius:7px; font-size:15px; color:var(--text); background:#fbfcfd;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none; border-color:var(--accent-blue); background:#fff;}
  .field textarea{resize:vertical; min-height:80px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:480px){.row2{grid-template-columns:1fr;}}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{border:1.5px solid var(--border); background:#fbfcfd; padding:9px 14px; border-radius:20px; font-size:13.5px; font-weight:600; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .chip.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;}
  .chip.on .dot{background:var(--accent); opacity:1;}

  /* ---------- Buttons ---------- */
  .btnbar{display:flex; gap:10px; margin-top:18px;}
  .btn{border:none; border-radius:8px; padding:12px 18px; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:7px; letter-spacing:.02em;}
  .btn svg{width:16px;height:16px;}
  .btn-primary{background:var(--navy); color:#fff; flex:1;}
  .btn-primary:active{background:var(--navy-deep);}
  .btn-accent{background:var(--accent); color:#fff; flex:1;}
  .btn-ghost{background:transparent; color:var(--navy); border:1.5px solid var(--border);}
  .btn-danger{background:transparent; color:var(--danger); border:1.5px solid #f0c6c0;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.45;}
  .fab{position:fixed; right:18px; bottom:22px; width:56px;height:56px;border-radius:50%; background:var(--accent); color:#fff; display:flex;align-items:center;justify-content:center; box-shadow:0 6px 18px rgba(227,90,42,.45); z-index:30; border:none;}
  .fab svg{width:26px;height:26px;}

  /* ---------- Photos ---------- */
  .photo-add{border:2px dashed var(--border); border-radius:10px; padding:22px 10px; text-align:center; color:var(--muted); font-size:13px;}
  .photo-add svg{width:26px;height:26px; margin-bottom:6px; color:var(--silver-dim);}
  .photo-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:14px;}
  .photo-item{border:1px solid var(--border); border-radius:9px; overflow:hidden; background:#fbfcfd;}
  .photo-item img{width:100%; height:120px; object-fit:cover; display:block; background:#e4e7ec;}
  .photo-item .meta{padding:8px;}
  .photo-item select{width:100%; font-size:11.5px; padding:5px 6px; border-radius:5px; border:1px solid var(--border); margin-bottom:6px;}
  .photo-item input{width:100%; font-size:11.5px; padding:5px 6px; border-radius:5px; border:1px solid var(--border);}
  .photo-item .del{width:100%; margin-top:6px; background:transparent; border:1px solid #f0c6c0; color:var(--danger); border-radius:5px; padding:5px; font-size:11px; font-weight:700;}
  .etat-select{font-weight:700; border-width:1.5px;}
  .etat-select.etat-none{color:var(--muted); border-color:var(--border);}
  .etat-select.etat-conforme{color:var(--ok); border-color:var(--ok); background:#f2faf5;}
  .etat-select.etat-moyen{color:var(--warn); border-color:var(--warn); background:#fdf8ec;}
  .etat-select.etat-remplacer{color:var(--danger); border-color:var(--danger); background:#fdf1ef;}

  /* ---------- Signature ---------- */
  .sigbox{border:1.5px dashed var(--border); border-radius:9px; background:#fdfdfe; touch-action:none;}
  canvas.sigpad{width:100%; height:150px; display:block; border-radius:9px;}
  .sig-actions{display:flex; justify-content:space-between; align-items:center; margin-top:8px;}
  .sig-actions .status{font-size:11.5px; color:var(--muted);}
  .sig-actions .status.done{color:var(--ok); font-weight:600;}
  .clearlink{background:transparent;border:none;color:var(--accent-blue); font-size:12.5px; font-weight:600;}

  /* ---------- Badges / status ---------- */
  .badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:20px;}
  .badge.brouillon{background:#fdf2df; color:var(--warn);}
  .badge.finalise{background:#e5f5ea; color:var(--ok);}
  .badge.facturer{background:#e8f0fa; color:var(--accent-blue);}
  .badge.reserve{background:#fbeae6; color:var(--danger);}

  .jour-card{border:1px solid var(--border); border-radius:9px; padding:11px 13px; margin-bottom:10px; background:#fbfcfd;}
  .jour-head{display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap;}
  .jour-badge{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; background:var(--navy); color:#fff; padding:2px 7px; border-radius:5px;}
  .jour-date{font-weight:700; font-size:13.5px; color:var(--navy);}
  .jour-horaire{font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .jour-btns{margin-left:auto; display:flex; gap:5px;}
  .jour-btns .btn{padding:5px 7px;}
  .jour-desc{font-size:13px; color:var(--text); line-height:1.4; white-space:pre-wrap;}

  .cloture-toggle{display:flex; align-items:flex-start; gap:12px; border:1.5px solid var(--border); border-radius:10px; padding:14px; cursor:pointer;}
  .cloture-toggle.on{border-color:var(--ok); background:#f2faf5;}
  .ct-box{width:24px; height:24px; border-radius:6px; border:2px solid var(--border); flex:none; display:flex; align-items:center; justify-content:center; color:#fff; margin-top:1px;}
  .cloture-toggle.on .ct-box{background:var(--ok); border-color:var(--ok);}
  .ct-box svg{width:14px;height:14px;}
  .ct-title{font-weight:700; color:var(--navy); font-size:14.5px;}
  .ct-sub{font-size:12px; color:var(--muted); margin-top:2px; line-height:1.4;}

  /* ---------- History ---------- */
  .rcard{padding:15px 16px; margin-bottom:12px; display:flex; gap:12px; align-items:flex-start;}
  .rcard .ico{width:38px;height:38px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .rcard .ico svg{width:18px;height:18px;}
  .rcard .body{flex:1; min-width:0;}
  .rcard .ref{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);}
  .rcard .client{font-weight:700; font-size:15.5px; color:var(--navy); margin:1px 0 3px;}
  .rcard .sub{font-size:12.5px; color:var(--muted);}
  .rcard .actions{display:flex; gap:6px; margin-top:10px;}
  .rcard .actions button{padding:7px 10px; font-size:12px; border-radius:6px;}
  .rcard .actions svg{width:13px;height:13px;}

  .settings-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .settings-row:last-of-type{border-bottom:none;}
  .settings-row .btn{padding:6px 9px;}
  .settings-row-client .scn{font-weight:700; color:var(--navy); font-size:14.5px;}
  .settings-row-client .scs{font-size:11.5px; color:var(--muted); margin-top:2px;}
  select.client-picker{width:100%; padding:10px 11px; border:1.5px solid var(--accent-blue); border-radius:7px; font-size:15px; background:#f4f8fc; margin-bottom:10px; font-weight:600; color:var(--navy);}
  .autofill-note{font-size:11.5px; color:var(--muted); margin:-8px 0 14px;}

  .empty{text-align:center; padding:50px 20px; color:var(--muted);}
  .empty svg{width:44px;height:44px; color:var(--silver-dim); margin-bottom:10px;}
  .empty .t{font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; color:var(--navy); font-size:18px; letter-spacing:.03em;}

  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--navy-deep); color:#fff; padding:11px 18px; border-radius:8px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.3); z-index:100; display:flex; align-items:center; gap:8px; max-width:90%;}
  .toast svg{width:16px;height:16px; flex:none;}
  .toast.err{background:#5c231d;}

  .perf{border-top:1px dashed var(--border); margin:18px 0; position:relative;}

  .info-mail{background:#fbf5ee; border:1px solid #f0dcc3; border-radius:8px; padding:11px 13px; font-size:12.5px; color:#7a5a1f; display:flex; gap:8px; margin-top:12px;}
  .info-mail svg{width:16px;height:16px;flex:none; margin-top:1px;}

  .preview-block{margin-bottom:16px;}
  .preview-block h3{font-size:14px; margin:0 0 6px; display:flex; align-items:center; gap:6px;}
  .preview-block .kv{display:grid; grid-template-columns:120px 1fr; gap:4px 10px; font-size:13.5px;}
  .preview-block .kv div:nth-child(odd){color:var(--muted); font-weight:600;}
  .preview-block p{font-size:13.5px; line-height:1.5; margin:4px 0;}
</style>
</head>
<body>

<div class="appbar">
  <img id="logoMini" alt="Logo M.S.C.I 84" width="84" height="84">
  <div class="titles">
    <div class="brand">M.S.C.I<span> 84</span></div>
    <div class="sub">Rapports d'intervention</div>
  </div>
</div>
<div class="tabs">
  <button id="tabNew" class="active" onclick="goTab('new')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    Nouveau
  </button>
  <button id="tabHist" onclick="goTab('hist')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
    Historique
  </button>
  <button id="tabSettings" onclick="goTab('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    Réglages
  </button>
</div>

<main id="app"></main>
<button class="fab" id="fabNew" onclick="startNewReport()" style="display:none;">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
</button>

<script>
/* ============================= ICONS ============================= */
const ICONS = {
  client:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 1 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2 2.5-2.5z"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  sign:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17s2-1 4 0 3 1 5-1 3-2 5-1M3 21h18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>',
  arrowL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>',
  arrowR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg>',
  hardhat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18v-2a8 8 0 0 1 16 0v2"/><path d="M2 18h20M12 8V4"/></svg>',
  building:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v16M12 21v-9a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v9"/><path d="M8 8h0M8 12h0M8 16h0M16 13h0M16 17h0"/><path d="M2 21h20"/></svg>'

/* ============================= STORAGE ============================= */
// Sauvegarde locale sur l'appareil (fonctionne une fois le fichier ouvert
// directement dans le navigateur, sans dépendre de Claude.ai).
const SK = { reports:'msci84:reports', counter:'msci84:ref-counter', clients:'msci84:clients', techniciens:'msci84:techniciens' };
const memoryFallback = {}; // filet de sécurité si localStorage est indisponible (ex: navigation privée stricte)
function storageGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ return Object.prototype.hasOwnProperty.call(memoryFallback, key) ? memoryFallback[key] : null; }
}
function storageSet(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ memoryFallback[key] = value; return false; }
}
async function loadReports(){
  try{ const v = storageGet(SK.reports); return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function persistReports(){
  const ok = storageSet(SK.reports, JSON.stringify(state.reports));
  if(!ok) showToast("Stockage indisponible sur cet appareil — la sauvegarde n'a pas pu être enregistrée.", true);
}
async function loadClients(){
  try{ const v = storageGet(SK.clients); return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function persistClients(){
  const ok = storageSet(SK.clients, JSON.stringify(state.clients));
  if(!ok) showToast("Stockage indisponible sur cet appareil — la sauvegarde n'a pas pu être enregistrée.", true);
}
async function loadTechniciens(){
  try{ const v = storageGet(SK.techniciens); return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function persistTechniciens(){
  const ok = storageSet(SK.techniciens, JSON.stringify(state.techniciens));
  if(!ok) showToast("Stockage indisponible sur cet appareil — la sauvegarde n'a pas pu être enregistrée.", true);
}
async function nextReference(){
  let n = 1;
  try{
    const v = storageGet(SK.counter);
    n = v ? (parseInt(v,10)+1) : 1;
  }catch(e){ n = (state.reports.length||0)+1; }
  storageSet(SK.counter, String(n));

function collectStepFields(step){
  const c = state.current;
  if(step===1){
    c.client.nom = readField('client.nom');
    c.client.site = readField('client.site');
    c.client.adresse = readField('client.adresse');
    c.client.contact = readField('client.contact');
    c.client.tel = readField('client.tel');
    c.client.siren = readField('client.siren');
    c.technicien = readField('technicien');
  }
  if(step===3){
    c.typeIntervention = readField('typeIntervention');
    c.fourniture = readField('fourniture');
    c.description = readField('description');
    c.materiaux = readField('materiaux');
    c.observations = readField('observations');
  }
  if(step===5){
    c.sigClientNom = readField('sigClientNom');
    c.sigTechNom = readField('sigTechNom');
  }
  if(step===6){
    c.reserve.detail = readField('reserve.detail');
  }
}
function validateStep(step){
  const c = state.current;
  if(step===1){
    if(!c.client.nom){ showToast('Merci de renseigner le nom du client.', true); return false; }
  }
  if(step===2){
    if(!c.journees.length){ showToast("Pensez à ajouter au moins une journée (facultatif pour continuer).", false); }
  }
  if(step===3){
    if(!c.typeIntervention){ showToast("Merci d'indiquer le type d'intervention.", true); return false; }
  }
  return true;
}
function goStep(delta){
  collectStepFields(state.step);
  if(delta>0 && !validateStep(state.step)) return;
  const ns = state.step + delta;
  if(ns<1 || ns>7) return;
  state.step = ns;
  render();
}
function jumpStep(n){
  collectStepFields(state.step);
  state.step = n;
  render();
}

/* ============================= SIGNATURE PADS ============================= */
function setupSigPad(canvasId, target){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#132140';
  let drawing=false, hasDrawn=false, last=null;

  // restore existing signature if present
  const existing = target==='sigClient' ? state.current.sigClient : state.current.sigTech;
  if(existing){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img,0,0,rect.width,rect.height); };
    img.src = existing;
    hasDrawn = true;
    updateSigStatus(target, true);
  }

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX-r.left, y: t.clientY-r.top };
  }
  function start(e){ e.preventDefault(); drawing=true; last=pos(e); }
  function move(e){
    if(!drawing) return; e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; hasDrawn=true;
  }
  function end(){
    if(!drawing) return;
    drawing=false;
    if(hasDrawn){
      const dataUrl = canvas.toDataURL('image/png');
      if(target==='sigClient') state.current.sigClient = dataUrl; else state.current.sigTech = dataUrl;
      updateSigStatus(target, true);
    }
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  canvas._clear = ()=>{
    ctx.clearRect(0,0,rect.width,rect.height);
    hasDrawn=false;
    if(target==='sigClient') state.current.sigClient=null; else state.current.sigTech=null;
    updateSigStatus(target,false);
  };
}
function clearSig(target){
  const canvas = document.getElementById(target==='sigClient'?'padClient':'padTech');
  if(canvas && canvas._clear) canvas._clear();
}
function updateSigStatus(target, done){
  const el = document.getElementById(target==='sigClient'?'statusClient':'statusTech');
  if(!el) return;
  el.textContent = done ? 'Signature enregistrée' : 'Non signé';
  el.classList.toggle('done', done);
}

/* ============================= PDF GENERATION ============================= */
async function buildPDF(report){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const pageW = 210, marginX = 16;
  let y = 16;

  const logoW = 24, logoH = logoW/LOGO_ASPECT;
  try{ doc.addImage(LOGO_DATA_URL, 'PNG', marginX, y, logoW, logoH); }catch(e){}
  const txX = marginX + logoW + 5;
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(19,33,64);
  doc.text(COMPANY.nom, txX, y+6);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(107,118,134);
  doc.text(COMPANY.baseline, txX, y+10.5);
  doc.text(`${COMPANY.ville}  ·  ${COMPANY.tel}  ·  ${COMPANY.email}`, txX, y+14.5);

  doc.setFont('courier','normal'); doc.setFontSize(9); doc.setTextColor(227,90,42);
  doc.text(report.reference || 'BROUILLON', pageW-marginX, y+6, {align:'right'});
  doc.setTextColor(107,118,134); doc.setFontSize(8);
  doc.text(`Période : ${reportDateRange(report)}`, pageW-marginX, y+10.5, {align:'right'});

  y += Math.max(22, logoH+6);
  doc.setDrawColor(220,224,231); doc.setLineWidth(0.6);
  doc.line(marginX, y, pageW-marginX, y);
  y += 3;

  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(19,33,64);
  doc.text("RAPPORT D'INTERVENTION", marginX, y+5);
  y += 11;

  function sectionTitle(t){
    doc.setFillColor(19,33,64); doc.rect(marginX, y, 3, 4.2, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(19,33,64);
    doc.text(t, marginX+5, y+3.6);
    y += 8;
  }
  function kv(label, value){
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(107,118,134);
    doc.text(label, marginX, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(26,34,51);
    const lines = doc.splitTextToSize(value || '—', pageW-marginX*2-42);
    doc.text(lines, marginX+42, y);
    y += Math.max(5, lines.length*4.6);
  }
  function paragraph(label, text){
    if(!text) return;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(107,118,134);
    doc.text(label, marginX, y); y += 4.6;
    doc.setFont('helvetica','normal'); doc.setTextColor(26,34,51);
    const lines = doc.splitTextToSize(text, pageW-marginX*2);
    doc.text(lines, marginX, y);
    y += lines.length*4.6 + 3;
  }
  function checkPageBreak(need){
    if(y+need > 282){ doc.addPage(); y = 18; }
  }

  sectionTitle('CLIENT & CHANTIER');
  kv('Client', report.client.nom);
  kv('Site / chantier', report.client.site);
  kv('Adresse', report.client.adresse);
  if(report.client.siren) kv('SIREN', report.client.siren);
  kv('Contact', [report.client.contact, report.client.tel].filter(Boolean).join(' · '));
  kv('Responsable', report.technicien);
  y += 3;

  const journees = [...(report.journees||[])].sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  if(journees.length){
    checkPageBreak(24);
    sectionTitle("JOURNÉES D'INTERVENTION");
    journees.forEach((j,i)=>{
      checkPageBreak(20);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(19,33,64);
      doc.text(`Jour ${i+1} — ${fmtDate(j.date)}`, marginX, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(107,118,134);
      doc.text(`${j.heureDebut||'—'}${j.heureFin?(' – '+j.heureFin):''}`, pageW-marginX, y, {align:'right'});
      y += 4.8;
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(26,34,51);
      const lines = doc.splitTextToSize(j.actions || '—', pageW-marginX*2);
      doc.text(lines, marginX, y);
      y += lines.length*4.4 + 3;
      doc.setDrawColor(230,233,238); doc.setLineWidth(0.3);
      doc.line(marginX, y, pageW-marginX, y);
      y += 4;
    });
  }

  checkPageBreak(30);
  sectionTitle('INTERVENTION');
  const procs = Object.keys(report.procedes).filter(k=>report.procedes[k]);
  kv('Type', report.typeIntervention);
  if(report.fourniture) kv('Fourniture', report.fourniture);
  kv('Procédés', procs.length ? procs.join(', ') : '—');
  y += 1;
  paragraph('Description des travaux', report.description);
  paragraph('Matériaux / pièces utilisés', report.materiaux);
  paragraph('Observations', report.observations);

  if(report.photos.length){
    checkPageBreak(20);
    sectionTitle('PHOTOS');
    const colW = (pageW-marginX*2-6)/2;
    const imgH = 42;
    let col = 0;
    for(const p of report.photos){
      checkPageBreak(imgH+16);
      const x = marginX + col*(colW+6);
      try{
        doc.addImage(p.dataUrl, 'JPEG', x, y, colW, imgH, undefined, 'FAST');
      }catch(e){
        try{ doc.addImage(p.dataUrl, 'PNG', x, y, colW, imgH, undefined, 'FAST'); }catch(e2){}
      }
      doc.setDrawColor(220,224,231); doc.rect(x, y, colW, imgH);
      const labelMap = {avant:'Avant', apres:'Après', general:'Général', defaut:'Défaut'};
      const cap = [labelMap[p.type]||'', p.legende].filter(Boolean).join(' — ');
      let capY = y+imgH+3.5;
      if(cap){
        doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(107,118,134);
        const capLines = doc.splitTextToSize(cap, colW);
        doc.text(capLines, x, capY);
        capY += capLines.length*3.3;
      }
      if(p.etat){
        const etatColor = p.etat==='conforme' ? [44,154,94] : p.etat==='moyen' ? [221,154,31] : [201,75,63];
        doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(...etatColor);
        doc.text(doc.splitTextToSize(ETAT_LABELS[p.etat], colW), x, capY);
      }
      col++;
      if(col===2){ col=0; y += imgH+15; } 
    }
    if(col===1) y += imgH+15;
  }

  checkPageBreak(50);
  y += 2;
  sectionTitle('SIGNATURES');
  const sigW = (pageW-marginX*2-10)/2;
  doc.setDrawColor(220,224,231);
  doc.rect(marginX, y, sigW, 26);
  doc.rect(marginX+sigW+10, y, sigW, 26);
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(107,118,134);
  doc.text('CLIENT', marginX+2, y-1.5);
  doc.text('TECHNICIEN', marginX+sigW+12, y-1.5);
  if(report.sigClient){ try{ doc.addImage(report.sigClient,'PNG', marginX+3, y+2, sigW-6, 20); }catch(e){} }
  if(report.sigTech){ try{ doc.addImage(report.sigTech,'PNG', marginX+sigW+13, y+2, sigW-6, 20); }catch(e){} }
  doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(26,34,51);
  doc.text(report.sigClientNom || '', marginX+2, y+30);
  doc.text(report.sigTechNom || '', marginX+sigW+12, y+30);
  y += 36;

  checkPageBreak(28);
  sectionTitle('CLÔTURE');
  const reserveOn = report.reserve && report.reserve.a;
  const termineOn = !!report.chantierTermine;
  doc.setDrawColor(220,224,231); doc.setLineWidth(0.4);
  function checkbox(label, checked, x){
    doc.rect(x, y-3.2, 4, 4);
    if(checked){
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(19,33,64);
      doc.text('X', x+0.7, y-0.1);
    }
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(26,34,51);
    doc.text(label, x+6, y);
  }
  checkbox(reserveOn ? 'Réserve émise par le client' : 'Sans réserve du client', reserveOn, marginX);
  y += 8;
  if(reserveOn && report.reserve.detail){
    paragraph('Détail de la réserve', report.reserve.detail);
  }
  checkbox('Chantier terminé — à transmettre en facturation', termineOn, marginX);
  y += 8;

  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(150,156,167);
    doc.text(`${COMPANY.nom} — SIRET ${COMPANY.siret}`, marginX, 291);
    doc.text(`Page ${i}/${pageCount}`, pageW-marginX, 291, {align:'right'});
  }
  return doc;
}

function downloadPDF(doc, filename){
  // Méthode blob + lien temporaire : plus fiable que doc.save() sur certains
  // navigateurs mobiles (Safari iOS, WebViews) que le téléchargement direct.
  const blob = doc.output('blob');
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

async function generatePDF(finalize){
  collectStepFields(state.step);
  const c = state.current;
  if(!c.client.nom || !c.typeIntervention){ showToast('Merci de compléter les informations obligatoires.', true); return; }
  if(!c.reference){ c.reference = await nextReference(); }
  if(finalize) c.status = 'finalise';

  const idx = state.reports.findIndex(r=>r.id===c.id);
  if(idx>=0) state.reports[idx] = JSON.parse(JSON.stringify(c)); else state.reports.push(JSON.parse(JSON.stringify(c)));
  await persistReports();

  try{
    const doc = await buildPDF(c);
    downloadPDF(doc, `${c.reference}_${(c.client.nom||'rapport').replace(/[^a-z0-9]+/gi,'_')}.pdf`);
    showToast('PDF généré et téléchargé.');
  }catch(e){
    console.error(e);
    showToast('Erreur PDF : ' + (e && e.message ? e.message : e), true);
  }
  render();
}

async function regeneratePDF(id){
  const r = state.reports.find(x=>x.id===id);
  if(!r) return;
  try{
    const doc = await buildPDF(r);
    downloadPDF(doc, `${r.reference}_${(r.client.nom||'rapport').replace(/[^a-z0-9]+/gi,'_')}.pdf`);
    showToast('PDF régénéré et téléchargé.');
  }catch(e){
    console.error(e);
    showToast('Erreur PDF : ' + (e && e.message ? e.message : e), true);
  }
}
